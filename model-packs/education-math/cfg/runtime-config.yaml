runtime:
  global_system_prompt_path: docs/5-standards/global-system-prompt.md
  domain_system_prompt_path: model-packs/education-math/prompts/domain-persona-v1.md
  turn_interpretation_prompt_path: model-packs/education-math/domain-lib/reference/turn-interpretation-spec-v1.md

  domain_physics_path: model-packs/education-math/modules/pre-algebra/domain-physics.json
  subject_profile_path: model-packs/education-math/profiles/student.yaml

  base_profile_path: model-packs/system/cfg/base-entity-profile.yaml
  domain_profile_extension_path: model-packs/education-math/cfg/domain-profile-extension.yaml
  profile_templates:
    default: model-packs/education-math/profiles/student.yaml
    student: model-packs/education-math/profiles/student.yaml

  slm_weight_overrides:
    turn_interpretation: low

  module_map:
    domain/edumath/pre-algebra/v1:
      module_path: model-packs/education-math/modules/pre-algebra
    domain/edumath/algebra-intro/v1:
      module_path: model-packs/education-math/modules/algebra-intro
    domain/edumath/algebra-1/v1:
      module_path: model-packs/education-math/modules/algebra-1
    domain/edumath/algebra-level-1/v1:
      module_path: model-packs/education-math/modules/algebra-level-1

  role_to_default_module:
    student: domain/edumath/pre-algebra/v1

  domain_roles:
    student: { tier: user, label: "Student" }
    observer: { tier: guest, label: "Observer" }

  access_control:
    required_role: user
    min_tier: guest

  additional_specs:
    - model-packs/education-presentation/world-sim/magic-circle-consent-v1.md
    - model-packs/education-presentation/world-sim/world-sim-spec-v1.md
    - model-packs/education-presentation/world-sim/artifact-and-mastery-spec-v1.md
    - model-packs/education-presentation/world-sim/mud-world-builder-spec-v1.md
    - model-packs/education-math/domain-lib/reference/turn-interpretation-spec-v1.md

  pre_turn_checks:
    - id: consent_boundary
      enabled: true
      description: "Require valid consent record before session proceeds."
      on_failure: escalate

  turn_input_defaults:
    correctness: partial
    hint_used: false
    response_latency_sec: 10.0
    frustration_marker_count: 0
    repeated_error: false
    off_task_ratio: 0.0
    step_count: 0
    problem_solved: false

  action_prompt_type_map:
    request_more_steps: more_steps_request
    request_verification_retry: verification_request
    request_method_justification: method_justification_request
    trigger_targeted_hint: hint
    inject_domain_rule: inject_domain_rule
    advance_tier: task_presentation
    definition_lookup: definition_lookup
    task_complete: task_complete
    tool_request: tool_request
    math_practice_request: math_practice_request

  deterministic_templates:
    hint: "Let's take one small step on {task_id}. Show the next equivalence-preserving move."
    more_steps_request: "Please show your work step-by-step for {task_id} and keep each operation balanced."
    verification_request: "Almost there! Please substitute your answer back into the original equation for {task_id} to verify it is correct."
    scaffold: "Let's break {task_id} into smaller steps and do one move at a time."
    zpd_scaffold: "Let's simplify this and do one clear step for {task_id}."
    pause_or_break: "Let's pause briefly. When ready, we will continue with one smaller step."
    definition_lookup: "{term}: {definition} Example: {example_in_context}"
    zpd_intervene_or_escalate: "Let's pause and reset. We can continue with a smaller step once you're ready."
    method_justification_request: "You used a non-standard method on {task_id}. Can you explain why your approach works?"
    task_complete: "Correct! Now solve: {task_id}. Show each step."
    tool_request: "Checking that math request."
    math_practice_request: "Here is a similar practice problem."
    default: "Continue with {task_id}. Share your next step and we will verify it together."

  tool_call_policies:
    request_verification_retry:
      - tool_id: algebra_parser
        payload:
          call_type: "verify_solution_substitution"
          equation: "{task_spec.current_problem.equation}"
          target_variable: "{task_spec.current_problem.target_variable}"
          expected_answer: "{task_spec.current_problem.expected_answer}"
    math_practice_request:
      - tool_id: generate_similar_math_problem
        payload:
          expression: "{turn_data.tool_expression}"
          difficulty: "{task_spec.nominal_difficulty}"

adapters:
  state_builder:
    module_path: model-packs/education-math/controllers/learning_adapters.py
    callable: build_initial_learning_state
  domain_step:
    module_path: model-packs/education-math/controllers/learning_adapters.py
    callable: domain_step
  turn_interpreter:
    module_path: model-packs/education-math/controllers/learning_adapters.py
    callable: interpret_turn_input
  task_initializer:
    module_path: model-packs/education-math/controllers/problem_generator.py
    callable: initialize_task
  tools:
    calculator:
      module_path: model-packs/education-math/controllers/tool_adapters.py
      callable: calculator_tool
    substitution_checker:
      module_path: model-packs/education-math/controllers/tool_adapters.py
      callable: substitution_checker_tool
    algebra_parser:
      module_path: model-packs/education-math/controllers/algebra_tools.py
      callable: algebra_parser_tool
    generate_problem:
      module_path: model-packs/education-math/controllers/problem_generator.py
      callable: generate_problem
    generate_similar_math_problem:
      module_path: model-packs/education-math/controllers/practice_bridge.py
      callable: generate_similar_math_problem

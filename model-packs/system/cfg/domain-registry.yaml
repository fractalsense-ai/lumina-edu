# domain-registry.yaml — Multi-domain registry for Project Lumina
#
# version: 1.0.0
# last_updated: 2026-04-27
#
# Maps each domain_id to its runtime-config.yaml path.
# Set LUMINA_DOMAIN_REGISTRY_PATH to this file to enable multi-domain routing.
# When a domain registry is active, requests specify domain_id to select a domain.
#
# See: standards/domain-registry-schema-v1.json

# Fallback domain for unauthenticated (anonymous) sessions.
# Set this to a "welcome" or "landing" domain pack when one exists.
# Defaults to default_domain when absent.
unauthenticated_domain: education

# Fallback domain for authenticated users whose role is not listed in
# role_defaults below.
default_domain: education

# Role-based default: when NLP routing returns no confident match, authenticated
# users with these roles are routed to the specified domain instead of the global
# default_domain.  Roles not listed fall through to default_domain.
#
# Design rationale: system-level operators (root, super_admin) should land in the
# system domain so they can query Lumina internals without being dropped into a
# domain-specific session (e.g. education).  The global default_domain is kept
# as education to mask system internals from domain-level users.
#
# admin users are routed to the domain matching their first
# governed_modules entry (via module_prefix resolution), so a teacher whose JWT
# carries domain/edu/… lands in education, not the system domain.
role_defaults:
  root: system
  super_admin: system

domains:
  education:
    runtime_config_path: model-packs/education/cfg/runtime-config.yaml
    label: Education — Algebra Level 1
    description: K-12 algebra tutoring domain with scaffolded problem solving.
    module_prefix: edu
    keywords:
      - algebra
      - equation
      - math
      - solve
      - variable
      - tutoring

  system:
    runtime_config_path: model-packs/system/cfg/runtime-config.yaml
    label: System — Lumina Infrastructure
    description: System domain for Project Lumina infrastructure queries. Routes admin and operator questions about System Log records, domain physics, RBAC, policy gates, and Lumina operational concepts. Only root and super_admin roles may execute sessions in this domain.
    module_prefix: sys
    keywords:
      - ctl
      - ledger
      - commitment
      - trace event
      - escalation
      - standing order
      - invariant
      - system physics
      - domain physics
      - domain pack
      - domain authority

  education-foundation:
    runtime_config_path: model-packs/education-foundation/cfg/runtime-config.yaml
    label: Education Foundation
    description: Shared education schemas, monitors, reference specs, and foundation boundary physics for department packs.
    module_prefix: eduf
    keywords:
      - education foundation
      - learning state
      - zpd
      - fluency
      - vocabulary growth
      - shared schema

  education-presentation:
    runtime_config_path: model-packs/education-presentation/cfg/runtime-config.yaml
    label: Education Presentation
    description: Shared education presentation and world-sim references. Cosmetic only; does not own learning or escalation physics.
    module_prefix: edupres
    keywords:
      - world sim
      - presentation
      - narrative
      - consent
      - magic circle
      - mud world

  # ── Template domain (commented out) ──────────────────────────────
  # Uncomment and customise when building a new domain from the template.
  # See: model-packs/template/README.md

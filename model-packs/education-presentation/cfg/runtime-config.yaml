runtime:
  global_system_prompt_path: docs/5-standards/global-system-prompt.md
  domain_system_prompt_path: model-packs/education-presentation/prompts/domain-persona-v1.md
  turn_interpretation_prompt_path: model-packs/education-presentation/domain-lib/reference/turn-interpretation-spec-v1.md

  domain_physics_path: model-packs/education-presentation/modules/presentation-core/domain-physics.json
  subject_profile_path: model-packs/education-presentation/profiles/entity.yaml

  base_profile_path: model-packs/system/cfg/base-entity-profile.yaml
  domain_profile_extension_path: model-packs/education-presentation/cfg/domain-profile-extension.yaml
  profile_templates:
    default: model-packs/education-presentation/profiles/entity.yaml
    presentation_authority: model-packs/education-presentation/profiles/entity.yaml

  slm_weight_overrides:
    turn_interpretation: low

  module_map:
    domain/edupres/presentation-core/v1:
      module_path: model-packs/education-presentation/modules/presentation-core

  role_to_default_module:
    presentation_authority: domain/edupres/presentation-core/v1
    observer: domain/edupres/presentation-core/v1

  domain_roles:
    presentation_authority: { tier: admin, label: "Education Presentation Authority" }
    observer: { tier: guest, label: "Presentation Observer" }

  access_control:
    required_role: admin
    min_tier: admin

  local_only: true

  additional_specs:
    - model-packs/education-presentation/world-sim/magic-circle-consent-v1.md
    - model-packs/education-presentation/world-sim/world-sim-spec-v1.md
    - model-packs/education-presentation/world-sim/artifact-and-mastery-spec-v1.md
    - model-packs/education-presentation/world-sim/mud-world-builder-spec-v1.md

  default_task_spec:
    task_id: education-presentation-reference-001
    nominal_difficulty: 0.0

  turn_input_defaults:
    on_track: true
    response_latency_sec: 5.0
    off_task_ratio: 0.0

  turn_input_schema:
    on_track:
      type: bool
      default: true
      description: "Whether the presentation request is in scope."
    response_latency_sec:
      type: float
      minimum: 0.0
      default: 5.0
    off_task_ratio:
      type: float
      minimum: 0.0
      maximum: 1.0
      default: 0.0

  action_prompt_type_map:
    request_more_detail: more_detail_request

  deterministic_templates:
    more_detail_request: "Please clarify which education presentation artifact you want to inspect."
    default: "Education presentation reference request acknowledged."

adapters:
  state_builder:
    module_path: model-packs/education-presentation/controllers/runtime_adapters.py
    callable: build_initial_state
  domain_step:
    module_path: model-packs/education-presentation/controllers/runtime_adapters.py
    callable: domain_step
  turn_interpreter:
    module_path: model-packs/education-presentation/controllers/runtime_adapters.py
    callable: interpret_turn_input

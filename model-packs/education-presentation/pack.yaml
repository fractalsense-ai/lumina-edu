# Education Presentation Model-Pack Manifest

pack_id: education-presentation
version: "0.1.0"
description: >-
  Shared presentation pack for education narrative framing, world-sim templates,
  and consent/presentation references. It is cosmetic only and does not own
  curriculum or escalation physics.

layers:
  model:
    - modules/*/domain-physics.json
  controller:
    - controllers/runtime_adapters.py
    - controllers/nlp_pre_interpreter.py
  domain_lib:
    - domain-lib/reference/turn-interpretation-spec-v1.md
  view:
    - prompts/domain-persona-v1.md
    - world-sim/
  docs:
    - docs/

modules:
  - presentation-core

default_module: presentation-core

entry_points:
  runtime_config: cfg/runtime-config.yaml
  ui_config: cfg/ui-config.yaml
  runtime_adapter: controllers/runtime_adapters.py
  nlp_pre_interpreter: controllers/nlp_pre_interpreter.py
